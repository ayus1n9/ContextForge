[project]
name = "contextforge"
version = "0.2.0"
description = "ContextForge — Secure Retrieval-Augmented Generation (RAG) Application with AI Security Guardrails"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ContextForge Security Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=5.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/tests/*"]

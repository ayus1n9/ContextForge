name: AegisRAG DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-and-quality:
    name: Security Analysis, Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check backend/app

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r backend/app

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=65 backend/tests

      - name: Execute Red-Team Adversarial Regression Suite
        run: |
          python -m backend.app.evaluation.redteam_runner --suite all --output redteam_results.json --report docs/red-team-results.md

      - name: Upload Red-Team Report
        uses: actions/upload-artifact@v4
        with:
          name: red-team-results
          path: |
            redteam_results.json
            docs/red-team-results.md
